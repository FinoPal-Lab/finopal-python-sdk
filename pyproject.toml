[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finopal-py-sdk"
version = "0.1.0"
description = "Python SDK for the FinoPal online payment gateway (درگاه پرداخت اینترنتی فینوپال)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "FinoPal", email = "support@finopal.ir" }]
keywords = [
    "finopal",
    "payment",
    "payment-gateway",
    "psp",
    "shaparak",
    "iran",
    "درگاه پرداخت",
    "پرداخت یاری",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Natural Language :: Persian",
]
dependencies = ["requests>=2.28.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "requests-mock>=1.11"]
flask = ["flask>=2.3"]
django = ["django>=4.2"]
fastapi = ["fastapi>=0.110"]

[project.urls]
Documentation = "https://finopal.ir/docs"
Repository = "https://github.com/FinoPal-Lab/finopal-python-sdk"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
finopal = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
